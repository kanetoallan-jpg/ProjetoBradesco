<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="card">
            <p class="p1">Entre com sua conta para continuar</p>

            <form>
                <!-- Campo E-mail -->
                <div class="field">
                    <label>E-mail</label>
                        <input
                            type="email"
                            placeholder="exemplo@email.com">
                    
                </div>
                <!-- Campo PassWord -->
                <div class="field">
                    <label>Senha</label>
                    <input
                        type="password"
                        placeholder="Digite sua senha">
                </div>
                <button class="btn" type="submit">Entrar</button>
            </form>
            <p class="foot">Não tem conta?
                <a href="#">Cadastre-se</a>
            </p>
        </div>
    </main>
</body>
</html>
